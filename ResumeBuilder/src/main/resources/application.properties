spring.application.name=ResumeBuilder
server.port=8081

spring.mongodb.uri=mongodb://localhost:27017/resume_builder_v1

# Bağlantı Havuzu Ayarları (prefix değişti)
spring.mongodb.connection-pool.min-size=10
spring.mongodb.connection-pool.max-size=100
spring.mongodb.connection-pool.max-wait-time=2000
spring.mongodb.connection-pool.max-connection-life-time=0

# Zaman Aşımı Ayarları
spring.mongodb.socket-timeout=2000
spring.mongodb.connect-timeout=2000
spring.mongodb.server-selection-timeout=3000

# Loglama (sorunu görmek için çok faydalı)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.boot.autoconfigure.mongo=DEBUG

# Mail sender ayarlari
# Mailtrap SMTP Ayarları (Email Testing için)
spring.mail.host=live.smtp.mailtrap.io
spring.mail.port=587
# Kullanici adi/sifre git'e eklenmez: application-secrets.properties dosyasinda
# veya MAIL_USERNAME / MAIL_PASSWORD ortam degiskenlerinde tutulur.
spring.config.import=optional:classpath:application-secrets.properties
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Güvenlik ayarları (zorunlu)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Opsiyonel - Debug için
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Loglama (geliştirme sırasında çok faydalı)
logging.level.org.springframework.mail=DEBUG

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=srvt46kcdg@gmail.com

# Uygulama ayarlari
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.mail.from=noreply@resumebuilder.com
# true ise e-postasini dogrulamayan kullanici giris yapamaz
app.auth.require-email-verification=true

# JWT (Base64, en az 256 bit). Uretimde JWT_SECRET ortam degiskeni ile degistirin.
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LXJlc3VtZS1idWlsZGVyLWp3dC1rZXktY2hhbmdlLW1lLTEyMzQ1Njc4OTA=}
app.jwt.expiration-ms=604800000

# Dosya yukleme
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# @Indexed alanlari icin indeks olustur (email unique)
spring.data.mongodb.auto-index-creation=true
